
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Link Hub</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 { margin: 0 0 10px; }
    header p { color: #cbd5e1; margin: 0; }

    main {
      width: min(600px, 92%);
      margin: 30px auto;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px #0000000d;
      margin-bottom: 24px;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover { background: #1d4ed8; }

    .link-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000a;
    }

    .link-info { flex: 1; min-width: 0; }

    .link-info a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .link-info a:hover { text-decoration: underline; }

    .link-info p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .delete {
      background: #fee2e2;
      color: #b91c1c;
      padding: 8px 10px;
    }

    .delete:hover { background: #fecaca; }

    #empty { color: #6b7280; text-align: center; }

    footer {
      text-align: center;
      color: #6b7280;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔖 My Link Hub</h1>
    <p>Save your favorite websites in one place.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Add a new link</h2>
      <form id="linkForm">
        <input id="linkName" placeholder="Website name" required>
        <input id="linkUrl" type="text"
          placeholder="https://example.com" required>
        <button type="submit">+ Save Link</button>
      </form>
    </section>

    <section>
      <h2>My Saved Links</h2>
      <div id="linksList"></div>
    </section>
  </main>

  <footer>My Link Hub · Made with HTML, CSS & JavaScript</footer>

  <script>
    const form = document.getElementById("linkForm");
    const nameInput = document.getElementById("linkName");
    const urlInput = document.getElementById("linkUrl");
    const linksList = document.getElementById("linksList");

    let links = [];

    try {
      links = JSON.parse(localStorage.getItem("myLinks")) || [];
    } catch {
      links = [];
    }

    function saveLinks() {
      localStorage.setItem("myLinks", JSON.stringify(links));
    }

    function renderLinks() {
      linksList.replaceChildren();

      if (links.length === 0) {
        const empty = document.createElement("p");
        empty.id = "empty";
        empty.textContent = "No links saved yet. Add your first link!";
        linksList.appendChild(empty);
        return;
      }

      links.forEach((link, index) => {
        const card = document.createElement("div");
        card.className = "link-card";

        const info = document.createElement("div");
        info.className = "link-info";

        const anchor = document.createElement("a");
        anchor.href = link.url;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        anchor.textContent = link.name;

        const address = document.createElement("p");
        address.textContent = link.url;

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.textContent = "Delete";
        remove.type = "button";
        remove.addEventListener("click", () => {
          links.splice(index, 1);
          saveLinks();
          renderLinks();
        });

        info.append(anchor, address);
        card.append(info, remove);
        linksList.appendChild(card);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = nameInput.value.trim();
      let rawUrl = urlInput.value.trim();

      if (!/^https?:\/\//i.test(rawUrl)) {
        rawUrl = "https://" + rawUrl;
      }

      let parsedUrl;

      try {
        parsedUrl = new URL(rawUrl);
      } catch {
        alert("Please enter a valid website URL.");
        return;
      }

      if (!["http:", "https:"].includes(parsedUrl.protocol)) {
        alert("Please enter an HTTP or HTTPS website URL.");
        return;
      }

      links.unshift({ name, url: parsedUrl.href });
      saveLinks();
      renderLinks();
      form.reset();
    });

    renderLinks();
  </script>
</body>
</html>
